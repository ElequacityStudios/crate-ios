# Builds crate as an unsigned IPA (Scripts/build-ipa.sh), attested once this
# repository is public: run by hand, as a workflow artifact; on a version tag
# (vX.Y), as a release. Install it with Scripts/sign-ipa.sh, which signs it
# with this team's certificate and profiles, or sign it with any other.
#
# The iOS frameworks come prebuilt and pinned; the Crate engine is built
# from ElequacityStudios/crate on main so changes to the fork reach the IPA.
name: ipa
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Sources/**'
      - 'Scripts/**'
      - '.github/workflows/ipa.yml'
      - 'project.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is the app's version
        if: github.ref_type == 'tag'
        run: |
          versions=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml | sort -u)
          [ "$GITHUB_REF_NAME" = "v$versions" ] || {
              echo "tag $GITHUB_REF_NAME, but project.yml says $versions" >&2; exit 1; }
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen meson ninja pkgconf libslirp
      - name: Check out the forked Crate engine
        uses: actions/checkout@v4
        with:
          repository: ElequacityStudios/crate
          ref: main
          path: crate
      - uses: dtolnay/rust-toolchain@stable
      - name: Test blob scanout and Venus fence retirement
        run: cargo test --all-targets -p crate-devices -p crate-host -p crate-virt
        working-directory: crate
      - name: Frameworks
        env:
          # For gh, checking each pinned release's attestation.
          GH_TOKEN: ${{ github.token }}
          VERIFY_ATTESTATION: 1
        run: |
          Scripts/fetch-frameworks.sh
          Scripts/fetch-stikjit.sh
          Scripts/build-moltenvk.sh
          Scripts/build-virgl-venus.sh
          CRATE_DIR="$GITHUB_WORKSPACE/crate" Scripts/build-crate.sh
      - name: Build
        run: |
          Scripts/build-ipa.sh "$RUNNER_TEMP/out/crate-unsigned.ipa"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 crate-unsigned.ipa | tee crate-unsigned.ipa.sha256
      # What the app and its helper say they are, not what project.yml says:
      # v0.1.1 shipped calling itself 0.1, as its plists named a version of
      # their own.
      - name: Check the IPA is the app's version
        working-directory: ${{ runner.temp }}/out
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/project.yml" | sort -u)
          build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/project.yml" | sort -u)
          mkdir check && unzip -q crate-unsigned.ipa -d check
          for plist in check/Payload/Crate.app/Info.plist check/Payload/Crate.app/PlugIns/*.appex/Info.plist; do
              got="$(plutil -extract CFBundleShortVersionString raw -o - "$plist") ($(plutil -extract CFBundleVersion raw -o - "$plist"))"
              [ "$got" = "$version ($build)" ] || {
                  echo "${plist#check/} says $got, but project.yml says $version ($build)" >&2; exit 1; }
          done
          rm -rf check
      # Attestations are free on a public repository only.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/out/crate-unsigned.ipa
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: crate-unsigned
          path: |
            ${{ runner.temp }}/out/crate-unsigned.ipa
            ${{ runner.temp }}/out/crate-unsigned.ipa.sha256
      - name: Release
        if: github.ref_type == 'tag'
        working-directory: ${{ runner.temp }}/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One line a paragraph: GitHub shows every newline in release notes.
          cat > notes.md <<EOF
          crate $GITHUB_REF_NAME for iPhone and iPad, unsigned: sign it with your own Apple account, then install it. [INSTALL.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/INSTALL.md) has the steps, and a request to paste into Claude Code, which does them for you.

          Built from $GITHUB_SHA with crate $(cat "$GITHUB_WORKSPACE/Frameworks/Crate.version") and $(cat "$GITHUB_WORKSPACE/Frameworks/Frameworks.version"), each attested. To check where this IPA came from: \`gh attestation verify crate-unsigned.ipa --repo $GITHUB_REPOSITORY\`

              SHA-256 $(cut -d' ' -f1 crate-unsigned.ipa.sha256)
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "crate $GITHUB_REF_NAME" --notes-file notes.md \
              crate-unsigned.ipa crate-unsigned.ipa.sha256
